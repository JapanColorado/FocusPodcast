// The app bundles the project LICENSE as an asset. It is generated into the build
// directory rather than the source tree, and that directory is registered as an
// extra assets source.
task copyLicense(type: Copy) {
    from "$rootDir/LICENSE"
    into layout.buildDirectory.dir("generated/license-assets")
    rename { String fileName ->
        fileName + ".txt"
    }
}

android.sourceSets.main.assets.srcDirs += layout.buildDirectory.dir("generated/license-assets").get().asFile

preBuild.dependsOn copyLicense
