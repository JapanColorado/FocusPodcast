plugins {
    id('com.android.application')
}
apply from: "../common.gradle"

android {
    def secrets = new Properties()
    File secretsFile = rootProject.file('secrets.properties')
    if (secretsFile.exists()) {
        secrets.load(new FileInputStream(secretsFile))
    } else {
        println "secrets.properties does not exist: building with placeholder PodcastIndex keys " +
                "and the default debug signing config. See README to configure it."
    }
    // A release build still needs a real keystore; a debug build falls back to the default one.
    def hasSigningSecrets = secrets.getProperty('storeFile') != null

    defaultConfig {
        namespace = "dev.russell.focuspodcast"
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        applicationId = rootProject.ext.applicationId

        buildConfigField "String", "PODCASTINDEX_API_KEY",
                secrets.getProperty('podcastindexApiKey', '"optional"')
        buildConfigField "String", "PODCASTINDEX_API_SECRET",
                secrets.getProperty('podcastindexApiSecret', '"optional"')

        kapt {
            arguments {
                arg('eventBusIndex', 'dev.russell.focuspodcast.ApEventBusIndex')
            }
        }
    }

    signingConfigs {
        if (hasSigningSecrets) {
            releaseConfig {
                enableV1Signing = true
                enableV2Signing = true
                storeFile = file(secrets.getProperty('storeFile'))
                storePassword = secrets.getProperty('storePassword')
                keyAlias = secrets.getProperty('keyAlias')
                keyPassword = secrets.getProperty('keyPassword')
            }

            debugConfig {
                storeFile = file(secrets.getProperty('storeFile'))
                storePassword = secrets.getProperty('storePassword')
                keyAlias = secrets.getProperty('keyAlias')
                keyPassword = secrets.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // Separate package so the debug build installs next to the release build with its own data
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            signingConfig = hasSigningSecrets ? signingConfigs.debugConfig : signingConfigs.debug
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            if (hasSigningSecrets) {
                signingConfig = signingConfigs.releaseConfig
            }
        }
    }

    lint {
        disable += ['ObsoleteLintCustomCheck', 'UnusedAttribute', 'BatteryLife', 'InflateParams',
                'RestrictedApi', 'VectorDrawableCompat',
                'UseCompoundDrawables', 'NestedWeights', 'Overdraw', 'UselessParent', 'TextFields',
                'AlwaysShowAction', 'Autofill', 'ClickableViewAccessibility', 'ContentDescription',
                'KeyboardInaccessibleWidget', 'LabelFor', 'SetTextI18n', 'HardcodedText', 'RelativeOverlap',
                'RtlCompat', 'RtlHardcoded',
                // False positive: PlaybackService does declare the android.media.browse
                // .MediaBrowserService intent-filter, but it is declared in core's manifest and
                // lint only sees app's own when checkDependencies is off.
                'MissingMediaBrowserServiceIntentFilter']
    }

    androidResources {
        additionalParameters += "--no-version-vectors"
    }

}



