plugins {
    id 'com.android.library'
}
apply from: "../../common.gradle"

repositories {
//    flatDir {
//        dirs 'libs'
//    }
}
android {
    defaultConfig {
        namespace "allen.town.focus_common"
    }
}

dependencies {
    api project(':lib:theme')
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "com.google.android.material:material:$googleMaterialVersion"
    implementation "androidx.preference:preference-ktx:$preferenceVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    implementation 'androidx.browser:browser:1.3.0'
    api 'androidx.multidex:multidex:2.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    def material_dialog_version = "3.3.0"
    api "com.afollestad.material-dialogs:core:$material_dialog_version"
    api "com.afollestad.material-dialogs:input:$material_dialog_version"
    api "com.afollestad.material-dialogs:color:$material_dialog_version"
    api "com.afollestad.material-dialogs:bottomsheets:$material_dialog_version"
    api 'androidx.palette:palette-ktx:1.0.0'
    api 'com.afollestad:material-cab:2.0.1'
    api "dev.chrisbanes.insetter:insetter:0.6.1"
    api 'com.google.code.gson:gson:2.8.5'
    api "com.github.Redman1037:TSnackBar:V2.0.0"
    implementation "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion"
    implementation "io.reactivex.rxjava2:rxjava:$rxJavaVersion"
    api 'com.beloo.widget:ChipsLayoutManager:0.3.7@aar'
    api 'com.orhanobut:logger:1.15'
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"

}
