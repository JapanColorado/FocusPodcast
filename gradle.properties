org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true

# Deprecated in AGP 9 (removed in 10) but still needed: iconify 2.2.2 and TriangleLabelView
# 1.1.2 depend on the legacy support library (see `./gradlew :app:checkJetifier`).
android.enableJetifier=true
android.useAndroidX=true
# Deprecated in AGP 9 (removed in 10). R8 full mode has never been tested against the
# reflection-heavy dependencies (fyydlin/Moshi/Retrofit, EventBus); test a release build on a
# device before dropping this.
android.enableR8.fullMode=false
android.nonTransitiveRClass=false
