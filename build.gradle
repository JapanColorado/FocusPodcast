buildscript {
    ext.kotlin_version = '1.9.23'
    // 1.23.8 is the last 1.23.x; it embeds the Kotlin 1.9 compiler, which is what
    // this project builds with. Do not jump to 2.x without moving Kotlin first.
    ext.detekt_version = '1.23.8'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.1'
        classpath 'org.codehaus.groovy:groovy-xml:3.0.9'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:$detekt_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // Aliyun's "public" mirror is the only reachable source left for
        // com.beloo.widget:ChipsLayoutManager:0.3.7, an ex-jcenter artifact that was
        // never published to Maven Central.
        maven { url "https://maven.aliyun.com/repository/public" }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.AbstractKotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}


project.ext {
    //app info
    applicationId = "allen.town.focus.podcast"
    compileSdkVersion = 35 //jdk need 17 and latter
    minSdkVersion = 21
    targetSdkVersion = 35
    versionCode = 79
    versionName = "2.8.5.20250928"

    // AndroidX
    annotationVersion = "1.8.0"
    appcompatVersion = "1.4.2"
    coreVersion = "1.5.0"
    coreKtxVersion = "1.7.0"
    fragmentVersion = "1.3.6"
    mediaVersion = "1.4.3"
    paletteVersion = "1.0.0"
    preferenceVersion = "1.2.0"
    recyclerViewVersion = "1.2.1"
    viewPager2Version = "1.1.0-beta01"
    workManagerVersion = "2.7.1"
    googleMaterialVersion = "1.7.0-alpha02"
    lifecycle_version = "2.0.0"

    // Third-party
    commonslangVersion = "3.7"
    commonsioVersion = "2.5"
    jsoupVersion = "1.15.1"
    glideVersion = "4.13.2"
    okhttpVersion = "4.9.2"
    okioVersion = "1.17.5"
    eventbusVersion = "3.3.1"
    rxAndroidVersion = "2.1.1"
    rxJavaVersion = "2.2.2"
    iconifyVersion = "2.2.2"
    exoPlayerVersion = "2.15.1"
    exoOkhttpExtensionPlayerVersion = "2.14.2"
    audioPlayerVersion = "v2.0.0"
    lattieVersion = "5.0.3"

    //Tests
    awaitilityVersion = "3.1.6"
    junitVersion = "4.13"
    robolectricVersion = "4.12.2"
    robotiumSoloVersion = "5.6.3"
    espressoVersion = "3.2.0"
    runnerVersion = "1.2.0"
    rulesVersion = "1.2.0"
}


// ---------------------------------------------------------------------------
// detekt: static analysis for the Kotlin sources.
//
// The config in config/detekt/detekt.yml builds on detekt's default config but
// switches off every stylistic rule, so this gate only reports likely bugs
// (unsafe !!, swallowed/over-broad exceptions, empty blocks, dead code).
// Test sources are excluded on purpose: test code legitimately catches broad
// exceptions and keeps deliberately empty stubs.
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: "io.gitlab.arturbosch.detekt"

    detekt {
        toolVersion = rootProject.ext.detekt_version
        buildUponDefaultConfig = true
        config.setFrom(rootProject.file("config/detekt/detekt.yml"))
        // There is deliberately no baseline: every finding is either fixed or carries a
        // targeted @Suppress with a `// detekt: ...` justification. If one is ever added,
        // set `baseline = rootProject.file("config/detekt/baseline.xml")` here -- but never
        // for UnsafeCallOnNullableType, PrintStackTrace or EmptyCatchBlock.
        ignoreFailures = false
        parallel = true
        source.setFrom(
                files("src/main/java", "src/main/kotlin").filter { it.exists() }
        )
    }

    // The plain `detekt` task analyses sources without a compile classpath, which silently
    // disables every rule that needs type resolution -- UnsafeCallOnNullableType, the `!!`
    // gate, above all. `detektDebug` is the same analysis with the debug variant's
    // classpath, so chain it in and `./gradlew detekt` checks both.
    plugins.withId("com.android.base") {
        tasks.named("detekt") { dependsOn("detektDebug") }
    }

    tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
        jvmTarget = "17"
        reports {
            html.required = true
            xml.required = false
            txt.required = true
            sarif.required = false
            md.required = false
        }
    }
}
