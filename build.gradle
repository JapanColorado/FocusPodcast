buildscript {
    ext.kotlin_version = '2.4.20'
    // detekt 1.23.x embeds the Kotlin 2.0 compiler and uses AGP's removed variant API, so it
    // cannot analyse this Kotlin 2.4 / AGP 9 build. 2.0.0-alpha.6 is built on Kotlin 2.4.10;
    // move to the 2.0 stable release when it ships.
    ext.detekt_version = '2.0.0-alpha.6'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        // com.android.legacy-kapt (kapt under AGP's built-in Kotlin)
        classpath 'com.android.tools.build:gradle-kotlin:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "dev.detekt:detekt-gradle-plugin:$detekt_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
        // Aliyun's "public" mirror is the only reachable source left for
        // com.beloo.widget:ChipsLayoutManager:0.3.7, an ex-jcenter artifact that was
        // never published to Maven Central.
        maven { url = "https://maven.aliyun.com/repository/public" }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}


project.ext {
    //app info
    applicationId = "dev.russell.focuspodcast"
    // androidx.core 1.19 requires compileSdk 37.
    compileSdkVersion = 37
    // The current AndroidX releases need 23, WorkManager 2.12 needs 24.
    minSdkVersion = 24
    targetSdkVersion = 35
    versionCode = 79
    versionName = "2.8.5.20250928"

    // AndroidX
    annotationVersion = "1.11.0"
    // AppCompat 1.6+ is needed for per-app locales (AppCompatDelegate.setApplicationLocales)
    // and routes back through OnBackInvokedCallback for predictive back.
    appcompatVersion = "1.8.0"
    coreVersion = "1.19.1"
    coreKtxVersion = "1.19.1"
    fragmentVersion = "1.9.1"
    mediaVersion = "1.8.0"
    paletteVersion = "1.0.0"
    preferenceVersion = "1.2.1"
    recyclerViewVersion = "1.4.0"
    viewPager2Version = "1.1.0"
    // 2.10 is the first release whose SystemForegroundService implements Service.onTimeout;
    // with 2.7.1 an exhausted Android 15 FGS time limit killed the process.
    workManagerVersion = "2.12.0"
    googleMaterialVersion = "1.14.0"

    // Third-party
    commonslangVersion = "3.21.0"
    // Do not upgrade: from 2.7 on FileUtils/IOUtils call java.nio.file, which Android only
    // has from API 26 (minSdk is 24).
    commonsioVersion = "2.5"
    jsoupVersion = "1.23.2"
    glideVersion = "4.16.0"
    okhttpVersion = "5.5.0"
    okioVersion = "3.18.2"
    eventbusVersion = "3.3.1"
    rxAndroidVersion = "2.1.1"
    rxJavaVersion = "2.2.21"
    iconifyVersion = "2.2.2"
    exoPlayerVersion = "2.19.1"
    exoOkhttpExtensionPlayerVersion = "2.19.1"
    audioPlayerVersion = "v2.0.0"
    lattieVersion = "6.7.1"

    //Tests
    awaitilityVersion = "4.3.0"
    junitVersion = "4.13.2"
    robolectricVersion = "4.17"
    robotiumSoloVersion = "5.6.3"
    espressoVersion = "3.7.0"
    runnerVersion = "1.7.0"
    rulesVersion = "1.7.0"
}


// Module scripts read the shared versions above as bare names ("$glideVersion"). Gradle 9
// deprecates resolving those through the parent project, so copy them into every module.
subprojects {
    rootProject.ext.properties.each { key, value -> ext.set(key, value) }
}

// ---------------------------------------------------------------------------
// detekt: static analysis for the Kotlin sources.
//
// The config in config/detekt/detekt.yml builds on detekt's default config but
// switches off every stylistic rule, so this gate only reports likely bugs
// (unsafe !!, swallowed/over-broad exceptions, empty blocks, dead code).
// Test sources are excluded on purpose: test code legitimately catches broad
// exceptions and keeps deliberately empty stubs.
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: "dev.detekt"

    detekt {
        toolVersion = rootProject.ext.detekt_version
        buildUponDefaultConfig = true
        config.setFrom(rootProject.file("config/detekt/detekt.yml"))
        // There is deliberately no baseline: every finding is either fixed or carries a
        // targeted @Suppress with a `// detekt: ...` justification. If one is ever added,
        // set `baseline = rootProject.file("config/detekt/baseline.xml")` here -- but never
        // for UnsafeCallOnNullableType, PrintStackTrace or EmptyCatchBlock.
        ignoreFailures = false
        // Any finding fails the build (detekt 1.x expressed this as build.maxIssues: 0).
        failOnSeverity = dev.detekt.gradle.extensions.FailOnSeverity.Info
        parallel = true
        source.setFrom(
                files("src/main/java", "src/main/kotlin").filter { it.exists() }
        )
    }

    // The plain `detekt` task analyses sources without a compile classpath, which silently
    // disables every rule that needs type resolution -- UnsafeCallOnNullableType, the `!!`
    // gate, above all. `detektDebug` is the same analysis with the debug variant's
    // classpath, so chain it in and `./gradlew detekt` checks both.
    plugins.withId("com.android.base") {
        tasks.named("detekt") { dependsOn("detektDebug") }
    }

    tasks.withType(dev.detekt.gradle.Detekt).configureEach {
        jvmTarget = "17"
        reports {
            html.required = true
            checkstyle.required = false
            sarif.required = false
            markdown.required = false
        }
    }
}
