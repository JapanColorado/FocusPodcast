// AGP 9 compiles Kotlin itself (built-in Kotlin), so there is no kotlin-android plugin.
// kapt still runs the Glide and EventBus annotation processors; with built-in Kotlin it
// comes from AGP's legacy-kapt plugin rather than kotlin-kapt.
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.parcelize'

android {
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion

        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true
        vectorDrawables.generatedDensities = []

        testApplicationId = "allen.town.podcast.core.tests"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }


    packaging {
        resources {
            excludes += ["META-INF/LICENSE.txt", "META-INF/NOTICE.txt",
                         // Extraneous jsoup files
                         "META-INF/CHANGES", "META-INF/README.md"]
            merges += "simplelogger.properties"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        animationsDisabled = true
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        disable += "GradleDependency"
        checkDependencies = false
        warningsAsErrors = false
        // true -- only report errors
        ignoreWarnings = true
        abortOnError = true
        checkGeneratedSources = false
        disable += 'Deprecation'
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }


}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    api "androidx.core:core-ktx:$coreKtxVersion"
}
