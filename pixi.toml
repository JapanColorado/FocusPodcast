[workspace]
name = "yagi"
description = "Yagi Android app: build, test and lint tasks"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
openjdk = "25.*"

[activation]
scripts = ["scripts/env.sh"]

[tasks]
# Environment sanity: JDK 25, Android SDK platform 37 / build-tools 36, local.properties.
check-env = "bash scripts/check-env.sh"

# Build / install / run: release is the default, -debug variants use the .debug appId.
build = { cmd = "./gradlew assembleRelease", depends-on = ["check-env"], description = "Assemble the signed, minified release APK (needs secrets.properties)" }
build-debug = { cmd = "./gradlew assembleDebug", depends-on = ["check-env"], description = "Assemble the debug APK" }
install = { cmd = "bash scripts/install.sh release", depends-on = ["build"], description = "Build and install the release APK on the connected adb device (needs secrets.properties)" }
install-debug = { cmd = "bash scripts/install.sh debug", depends-on = ["build-debug"], description = "Build and install the debug APK on the connected adb device" }
run = { cmd = "adb shell am start -n dev.russell.yagi/dev.russell.yagi.activity.SplashActivity", depends-on = ["install"], description = "Install the release APK and launch it" }
run-debug = { cmd = "adb shell am start -n dev.russell.yagi.debug/dev.russell.yagi.activity.SplashActivity", depends-on = ["install-debug"], description = "Install the debug APK and launch it" }
clean = { cmd = "./gradlew clean", description = "Delete all Gradle build outputs" }

# Verification
test = { cmd = "./gradlew testDebugUnitTest", depends-on = ["check-env"], description = "Run all JVM unit tests" }
lint = { cmd = "./gradlew lint", depends-on = ["check-env"], description = "Run Android lint on every module" }
nn = { cmd = "bash scripts/count-bangbang.sh", description = "Fail if the Kotlin !! count exceeds scripts/bangbang.max" }
detekt = { cmd = "./gradlew detekt", depends-on = ["check-env"], description = "Run detekt static analysis (config/detekt/detekt.yml)" }
check = { depends-on = ["build-debug", "test", "lint", "nn", "detekt"], description = "Everything CI would run" }

# Device inspection
logs = { cmd = "adb logcat --pid=$(adb shell pidof -s dev.russell.yagi)", description = "Logcat for the running release app" }
