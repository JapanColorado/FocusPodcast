[workspace]
name = "focuspodcast"
description = "FocusPodcast Android app: build, test and lint tasks"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
openjdk = "17.*"

[activation]
scripts = ["scripts/env.sh"]

[tasks]
# Environment sanity: JDK 17, Android SDK platform 35 / build-tools 34, local.properties.
check-env = "bash scripts/check-env.sh"

# Build
build = { cmd = "./gradlew assembleDebug", depends-on = ["check-env"], description = "Assemble the debug APK" }
release = { cmd = "./gradlew assembleRelease", depends-on = ["check-env"], description = "Assemble the signed, minified release APK (needs secrets.properties)" }
clean = { cmd = "./gradlew clean", description = "Delete all Gradle build outputs" }

# Verification
test = { cmd = "./gradlew testDebugUnitTest", depends-on = ["check-env"], description = "Run all JVM unit tests" }
lint = { cmd = "./gradlew lint", depends-on = ["check-env"], description = "Run Android lint on every module" }
nn = { cmd = "bash scripts/count-bangbang.sh", description = "Fail if the Kotlin !! count exceeds scripts/bangbang.max" }
detekt = { cmd = "./gradlew detekt", depends-on = ["check-env"], description = "Run detekt static analysis (config/detekt/detekt.yml)" }
check = { depends-on = ["build", "test", "lint", "nn", "detekt"], description = "Everything CI would run" }

# Device
install = { cmd = "bash scripts/install.sh", depends-on = ["build"], description = "Install the debug APK on the connected adb device" }
